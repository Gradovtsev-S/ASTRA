[platformio]
default_envs = esp32

[env:esp32]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
build_flags = -DASTRONOMY_ENGINE_WHOLE_SECOND

[env:board_diagnostics]
extends = env:esp32
upload_speed = 115200
build_src_filter = -<*> +<../test/board_diagnostics.cpp> +<sensors/sensor_chips.cpp>
